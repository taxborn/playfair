name: Release

on:
  push:
    branches: [main]

# Forgejo cancels in-progress runs of a workflow when a new one starts. That is
# fine for CI but dangerous mid-publish, so opt out here.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: docker
    # node, not rust: actions/checkout is a JavaScript action and needs node in
    # the job container. Keep this non-slim - the slim variants drop gcc, and
    # cargo needs cc to link.
    container:
      image: node:20-bookworm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed so the tag-existence check below sees existing tags.
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Read straight from Cargo.toml rather than via cargo, so the gate below
      # can run before the toolchain is installed.
      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml declares $VERSION"

      # The whole release strategy in one step: Cargo.toml is the source of
      # truth, and the tag is derived from it. A merge that did not bump the
      # version is simply not a release, and costs nothing beyond this point.
      - name: Has this version been released?
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists - nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is new - releasing."
          fi

      - name: Install Rust
        if: steps.check.outputs.release == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test
        if: steps.check.outputs.release == 'true'
        run: cargo test

      - name: Verify the package
        if: steps.check.outputs.release == 'true'
        run: cargo publish --dry-run

      # Publish before tagging: crates.io is immutable, a tag is not. This way a
      # tag always means "this is genuinely on crates.io".
      - name: Publish to crates.io
        if: steps.check.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Tag the release
        if: steps.check.outputs.release == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.version.outputs.version }}"
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.localhost"
          HOST="${GITHUB_SERVER_URL#https://}"
          git remote set-url origin "https://x-access-token:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git"
          git tag -a "$V" -m "Release $V"
          git push origin "$V"
